name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report a security vulnerability here** —
        use [private reporting](https://github.com/Rayman223/energy-cost-management/security/advisories/new)
        instead (see `SECURITY.md`).

  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: What you observed, and what you expected instead.
      placeholder: |
        Observed: the dashboard shows a 0 € estimate for gas.
        Expected: the estimate based on the active tariff grid.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a member with a shared BE tariff grid
        2. Add a gas reading dated today
        3. Open the dashboard
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected page, endpoint or script
      placeholder: "/tariffs.php, api.php?action=ingest_gas, app/scripts/cron_dynamic_prices.php…"
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.4.3"
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database
      placeholder: "MariaDB 10.11 / MySQL 8.0"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or date of the deployed version
      description: The project has no release tags — the commit SHA or the deploy date is what identifies your version.
      placeholder: "b673867, or « deployed 2026-07-28 »"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: PHP error log, browser console, or the CLI output. Automatically rendered as code — no backticks needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Relevant configuration
      description: >
        Anything from `config.php` that matters — OIDC on/off, IP allowlist,
        dynamic prices, EnergyID. **Never paste secrets** (passwords, client
        secrets, tokens).
    validations:
      required: false
