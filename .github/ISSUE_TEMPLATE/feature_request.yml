name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What are you trying to do that the application does not let you do today?
      placeholder: |
        I have a Dutch electricity contract with a capacity tariff, and there is
        no line key for it in the tariff grid.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. A rough sketch is fine.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tariffs / cost calculation
        - Dashboard & charts
        - Meter readings / import
        - Ingestion API
        - Authentication & accounts
        - Administration
        - Internationalization
        - Integrations (EnergyID, ENTSO-E, …)
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country concerned
      description: For anything tariff-related — national structures differ a lot.
      placeholder: "BE, NL, DE, FR…"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you already tried, or other designs you weighed.
    validations:
      required: false
