name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file (php -l)
        run: |
          find app -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -d display_errors=stderr -l
          echo "All PHP files passed syntax check."

      - name: Vérifier que config.example.php ne dérive pas du schéma
        run: php app/scripts/config_check.php --file=app/config/config.example.php --schema-only --strict

  js-lint:
    name: JS Syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Vérifier la syntaxe de tous les fichiers JS
        run: |
          shopt -s nullglob
          files=(app/public/assets/js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun fichier JS à vérifier."; exit 0
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
          echo "Tous les fichiers JS passent le contrôle de syntaxe."

  static-analysis:
    name: PHPStan (level 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2, phpstan:2.2.2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run PHPStan
        run: phpstan analyse --configuration=phpstan.dist.neon --no-progress --error-format=github

  tests:
    name: PHPUnit (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  tests-db:
    name: PHPUnit (intégration BDD)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: energy_test
          MARIADB_USER: energy_user
          MARIADB_PASSWORD: energy_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_mysql, mbstring

      - name: Install dev dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Importer le schéma
        run: mysql -h 127.0.0.1 -P 3306 -u energy_user -penergy_pass energy_test < app/sql/schema.sql

      - name: Config de test (pointe sur la base du service CI)
        run: |
          echo "<?php declare(strict_types=1); return ['database' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'energy_test', 'user' => 'energy_user', 'password' => 'energy_pass', 'charset' => 'utf8mb4']];" > app/config/config.php

      - name: Vérifier que les migrations rejouables sont idempotentes et convergent (garde C1)
        run: |
          # Contrat « baseline gelée » : schema.sql ne baseline QUE les migrations
          # non-idempotentes ; les migrations idempotentes sont appliquées par
          # migrate.php sur toute base qui ne les a pas encore enregistrées, une
          # seule fois (répare les bases existantes). Sur le schéma complet
          # fraîchement importé, cette application doit :
          #   1. réussir sans erreur  → chaque migration hors-seed est bien idempotente ;
          #   2. converger au 2e passage → plus aucune migration en attente.
          echo "→ 1er passage : rejeu des migrations idempotentes sur le schéma complet"
          php app/scripts/migrate.php
          echo "→ 2e passage : doit converger"
          OUT=$(php app/scripts/migrate.php --dry-run)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "Aucune migration en attente"; then
            echo "::error::migrate.php ne converge pas après import de schema.sql — une migration hors-seed n'est pas idempotente ou le seed est désynchronisé (cf. Issue #130 C1)."
            exit 1
          fi

      - name: PHPUnit — suite d'intégration (s'exécute contre la base)
        run: vendor/bin/phpunit --testsuite integration
