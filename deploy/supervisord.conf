[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/app/var/supervisord.pid
[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/app/logs/php.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
[program:scheduler]
command=php /app/app/scripts/scheduler.php
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/app/logs/scheduler.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
